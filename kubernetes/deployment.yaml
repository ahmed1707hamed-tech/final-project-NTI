apiVersion: apps/v1
kind: Deployment

metadata:
  name: finalproject
  namespace: ivolve

spec:
  replicas: 2

  selector:
    matchLabels:
      app: finalproject

  template:
    metadata:
      labels:
        app: finalproject

    spec:
      containers:
      - name: finalproject
        image: ahmed7amed9/finalproject:v1

        ports:
        - containerPort: 5000