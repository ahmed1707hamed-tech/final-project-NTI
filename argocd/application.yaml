apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: final-project-nti
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ahmed1707hamed-tech/final-project-NTI.git
    targetRevision: HEAD
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: ivolve

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true